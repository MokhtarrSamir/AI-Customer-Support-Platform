<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Support</title>
    <meta name="description" content="AI Customer Support Platform" />

    <!-- Bootstrap CSS and Bootstrap Icons, loaded from a CDN. No build step. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <noscript>
      <div class="alert alert-warning m-3">
        This application needs JavaScript to run.
      </div>
    </noscript>

    <div class="app-layout">
      <!-- Sidebar: hidden until the user is signed in -->
      <aside class="app-sidebar d-none" id="app-sidebar">
        <div class="sidebar-head">
          <span class="brand-mark brand-mark-sm"><i class="bi bi-headset"></i></span>
          <div>
            <div class="sidebar-title">AI Support</div>
            <div class="sidebar-subtitle">Customer platform</div>
          </div>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main navigation"></nav>

        <div class="sidebar-foot">
          <button type="button" class="btn btn-sm btn-outline-light w-100" id="logout-button">
            <i class="bi bi-box-arrow-right me-1"></i>Sign out
          </button>
        </div>
      </aside>

      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <div class="app-main">
        <!-- Top bar: hidden until the user is signed in -->
        <header class="app-topbar d-none" id="app-topbar">
          <button
            type="button"
            class="btn btn-link sidebar-toggle d-lg-none"
            id="sidebar-toggle"
            aria-label="Open navigation"
          >
            <i class="bi bi-list"></i>
          </button>

          <h1 class="topbar-title" id="topbar-title">Dashboard</h1>

          <div class="ms-auto d-flex align-items-center gap-2 text-end">
            <div>
              <div class="small fw-semibold" id="current-user-name"></div>
              <div class="small text-body-secondary" id="current-user-role"></div>
            </div>
            <span class="user-avatar d-none d-sm-inline-flex"><i class="bi bi-person"></i></span>
          </div>
        </header>

        <!-- Every page is rendered here by the router -->
        <main class="app-content" id="app-view">
          <div class="text-center py-5" role="status">
            <div class="spinner-border text-primary" aria-hidden="true"></div>
            <p class="text-body-secondary mt-3 mb-0">Starting the application...</p>
          </div>
        </main>
      </div>
    </div>

    <!-- Toasts and modals are injected here -->
    <div id="toast-host" class="toast-host"></div>
    <div id="modal-host"></div>

    <!-- Core -->
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/router.js"></script>

    <!-- Pages -->
    <script src="/js/pages/login.js"></script>
    <script src="/js/pages/register.js"></script>
    <script src="/js/pages/dashboard.js"></script>
    <script src="/js/pages/tickets.js"></script>
    <script src="/js/pages/ticket-details.js"></script>
    <script src="/js/pages/create-ticket.js"></script>
    <script src="/js/pages/ai-chat.js"></script>
    <script src="/js/pages/users.js"></script>
    <script src="/js/pages/statistics.js"></script>

    <!-- Entry point -->
    <script src="/js/app.js"></script>
  </body>
</html>
